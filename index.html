    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

    </div>

  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 200 200"><rect width="200" height="200" fill="#15120f"></rect><circle cx="100" cy="85" r="40" fill="none" stroke="#c9974a" stroke-width="4"></circle><text x="100" y="150" font-family="Georgia,serif" font-size="20" font-weight="900" fill="#f3ead9" text-anchor="middle">RIDERS</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tton, textarea {\n      font-family: 'Inter', sans-serif;\n      max-width: 100%;\n    }\n    img, svg, video { max-width: 100%; height: auto; }\n    .page-root {\n      overflow-x: hidden;\n      max-width: 100%;\n    }\n    .notice-toast {\n      box-sizing: border-box;\n      word-break: break-word;\n      overflow-wrap: anywhere;\n      max-height: 42vh;\n      overflow-y: auto;\n    }\n    .booking-field {\n      width: 100%;\n      min-width: 0;\n      -webkit-appearance: none;\n      appearance: none;\n    }\n    .slots-grid {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 8px;\n    }\n    .slots-grid button {\n      min-height: 44px;\n      min-width: 0;\n      width: 100%;\n      touch-action: manipulation;\n    }\n    .booking-confirm-btn {\n      width: 100%;\n      min-height: 48px;\n      touch-action: manipulation;\n    }\n    .booking-confirm-actions {\n      width: 100%;\n    }\n    .booking-confirm-actions a,\n    .booking-confirm-actions button {\n      min-height: 48px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      touch-action: manipulation;\n    }\n    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n\n    @media (max-width: 900px) {\n      .site-header {\n        padding: 12px 16px !important;\n        gap: 10px !important;\n        flex-wrap: nowrap !important;\n      }\n      .site-header .site-brand-text {\n        font-size: 15px !important;\n        line-height: 1.2 !important;\n      }\n      .site-header .site-nav {\n        display: none !important;\n      }\n      .site-header .site-cta {\n        padding: 12px 14px !important;\n        font-size: 12px !important;\n        white-space: nowrap !important;\n        flex-shrink: 0 !important;\n      }\n      [data-screen-label=\"hero\"] {\n        grid-template-columns: 1fr !important;\n        gap: 28px !important;\n        padding: 40px 16px !important;\n      }\n      [data-screen-label=\"services\"],\n      [data-screen-label=\"equipe\"],\n      [data-screen-label=\"galerie\"],\n      [data-screen-label=\"avis\"] {\n        padding: 48px 16px !important;\n      }\n      [data-screen-label=\"services\"] > div:last-child,\n      [data-screen-label=\"avis\"] > div:last-child,\n      [data-screen-label=\"galerie\"] > div:last-child {\n        grid-template-columns: 1fr 1fr !important;\n        gap: 12px !important;\n      }\n      [data-screen-label=\"equipe\"] > div:last-child {\n        grid-template-columns: 1fr 1fr !important;\n        gap: 16px !important;\n      }\n      [data-screen-label=\"reservation\"] {\n        padding: 48px 16px 96px !important;\n      }\n      .site-footer {\n        padding: 28px 16px !important;\n        flex-direction: column !important;\n        align-items: flex-start !important;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .notice-toast {\n        top: 10px !important;\n        width: calc(100vw - 20px) !important;\n        max-width: calc(100vw - 20px) !important;\n        padding: 14px 16px !important;\n        font-size: 14px !important;\n      }\n      .booking-title {\n        font-size: clamp(26px, 8vw, 32px) !important;\n      }\n      .booking-form-row {\n        grid-template-columns: 1fr !important;\n        gap: 12px !important;\n      }\n      .booking-field {\n        font-size: 16px !important;\n        min-height: 48px !important;\n        padding: 14px 14px !important;\n        line-height: 1.3 !important;\n      }\n      .slots-grid {\n        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;\n        gap: 10px !important;\n      }\n      .slots-grid button {\n        min-height: 48px !important;\n        font-size: 14px !important;\n        padding: 12px 6px !important;\n      }\n      .booking-confirm-btn {\n        position: sticky;\n        bottom: 12px;\n        z-index: 60;\n        min-height: 52px !important;\n        font-size: 14px !important;\n        box-shadow: 0 8px 24px rgba(0,0,0,0.45);\n      }\n      .booking-confirm-actions {\n        flex-direction: column !important;\n        align-items: stretch !important;\n      }\n      .booking-confirm-actions a,\n      .booking-confirm-actions button {\n        width: 100% !important;\n      }\n      [data-screen-label=\"services\"] > div:last-child,\n      [data-screen-label=\"avis\"] > div:last-child,\n      [data-screen-label=\"galerie\"] > div:last-child,\n      [data-screen-label=\"equipe\"] > div:last-child {\n        grid-template-columns: 1fr !important;\n      }\n    }\n\n    @media (max-width: 360px) {\n      .slots-grid {\n        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n      }\n      .site-header .site-brand-text {\n        font-size: 13px !important;\n      }\n    }\n  \u003c/style>\n\u003c/helmet>\n\n\n\u003cdiv class=\"page-root\" style=\"background:#15120f;color:#f3ead9;font-family:'Inter',sans-serif;min-height:100vh\">\n\n  \u003csc-if value=\"{{ showNotice }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv class=\"notice-toast\" role=\"status\" aria-live=\"polite\" style=\"position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99999;width:min(440px,92vw);padding:18px 20px;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,0.55);border:1px solid {{ noticeBorder }};background:{{ noticeBg }};color:{{ noticeFg }};animation:fadeUp 0.25s ease\">\n      \u003cdiv style=\"font-size:15px;line-height:1.7;white-space:pre-line;font-weight:500\">{{ noticeBody }}\u003c/div>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003c!-- NAV -->\n  \u003cheader class=\"site-header\" style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 32px;background:rgba(21,18,15,0.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,151,74,0.2)\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n      \u003cdiv style=\"width:44px;height:44px;border-radius:50%;border:2px solid {{ accent }};display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0\">\n        \u003cimage-slot id=\"logo\" shape=\"circle\" placeholder=\"Logo\" style=\"width:40px;height:40px\">\u003c/image-slot>\n      \u003c/div>\n      \u003cdiv class=\"site-brand-text\" style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:20px;letter-spacing:0.5px;min-width:0\">RIDERS \u003cspan style=\"color:{{ accent }}\">BARBER SHOP\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cnav class=\"site-nav\" style=\"display:flex;gap:28px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.5px;text-transform:uppercase\" data-screen-label=\"nav\">\n      \u003ca href=\"#services\" style=\"color:#f3ead9\">Services\u003c/a>\n      \u003ca href=\"#equipe\" style=\"color:#f3ead9\">Équipe\u003c/a>\n      \u003ca href=\"#galerie\" style=\"color:#f3ead9\">Galerie\u003c/a>\n      \u003ca href=\"#avis\" style=\"color:#f3ead9\">Avis\u003c/a>\n    \u003c/nav>\n    \u003ca class=\"site-cta\" href=\"#reservation\" style=\"font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;background:{{ accent }};color:#15120f;padding:10px 22px;border-radius:2px;font-weight:600\">Réserver\u003c/a>\n  \u003c/header>\n\n  \u003c!-- HERO -->\n  \u003csection style=\"position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:96px 64px;max-width:1440px;margin:0 auto\" data-screen-label=\"hero\">\n    \u003cdiv>\n      \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:14px;text-transform:uppercase;margin-bottom:18px\">Salon de coiffure homme — Casablanca\u003c/div>\n      \u003ch1 style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(40px,6vw,72px);line-height:1.02;margin:0 0 24px\">Riders\u003cbr>Barber Shop\u003c/h1>\n      \u003cdiv style=\"width:120px;height:6px;background:repeating-linear-gradient(45deg,{{ accent }} 0 8px,#15120f 8px 16px);margin-bottom:28px;border-radius:3px\">\u003c/div>\n      \u003cp style=\"font-size:17px;line-height:1.6;color:rgba(243,234,217,0.75);max-width:460px;margin:0 0 36px\">Coupe, barbe, soin de visage, lissage protéine et lissage shampooing. Réservez votre créneau en ligne, ajoutez-le directement à votre Google Calendar.\u003c/p>\n      \u003cdiv style=\"display:flex;gap:16px;flex-wrap:wrap\">\n        \u003ca href=\"#reservation\" style=\"font-family:'Oswald',sans-serif;background:{{ accent }};color:#15120f;padding:16px 32px;border-radius:2px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:14px\">Prendre rendez-vous\u003c/a>\n        \u003ca href=\"#services\" style=\"font-family:'Oswald',sans-serif;border:1px solid rgba(243,234,217,0.3);color:#f3ead9;padding:16px 32px;border-radius:2px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:14px\">Voir les services\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;border:1px solid rgba(201,151,74,0.3);background:#0d0b09\">\n      \u003cimage-slot id=\"hero-photo\" shape=\"rect\" fit=\"contain\" placeholder=\"Photo du salon\" src=\"cdfefd0a-1e22-4e45-ad71-9c5039e71df2\" style=\"width:100%;height:100%\">\u003c/image-slot>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- SERVICES -->\n  \u003csection id=\"services\" style=\"padding:80px 64px;max-width:1200px;margin:0 auto\" data-screen-label=\"services\">\n    \u003cdiv style=\"text-align:center;margin-bottom:56px\">\n      \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:12px\">Nos prestations\u003c/div>\n      \u003ch2 style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:36px;margin:0\">Services\u003c/h2>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n      \u003csc-for list=\"{{ services }}\" as=\"svc\" hint-placeholder-count=\"6\">\n        \u003cdiv style=\"background:#1c1712;border:1px solid rgba(201,151,74,0.18);border-radius:4px;padding:28px 24px;display:flex;flex-direction:column;gap:8px\">\n          \u003cdiv style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px\">{{ svc }}\u003c/div>\n          \u003cdiv style=\"height:2px;width:28px;background:{{ accent }}\">\u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- EQUIPE -->\n  \u003csection id=\"equipe\" style=\"padding:80px 64px;max-width:1200px;margin:0 auto\" data-screen-label=\"equipe\">\n    \u003cdiv style=\"text-align:center;margin-bottom:56px\">\n      \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:12px\">L'équipe\u003c/div>\n      \u003ch2 style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:36px;margin:0\">Nos barbiers\u003c/h2>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\n      \u003csc-for list=\"{{ team }}\" as=\"member\" hint-placeholder-count=\"4\">\n        \u003cdiv style=\"text-align:center\">\n          \u003cdiv style=\"width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:16px;border:2px solid rgba(201,151,74,0.3)\">\n            \u003cimage-slot id=\"team-{{ $index }}\" shape=\"circle\" placeholder=\"Photo\" style=\"width:100%;height:100%\">\u003c/image-slot>\n          \u003c/div>\n          \u003cdiv style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:17px\">{{ member.name }}\u003c/div>\n          \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:4px\">{{ member.role }}\u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- GALERIE -->\n  \u003csection id=\"galerie\" style=\"padding:80px 64px;max-width:1200px;margin:0 auto\" data-screen-label=\"galerie\">\n    \u003cdiv style=\"text-align:center;margin-bottom:56px\">\n      \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:12px\">Galerie\u003c/div>\n      \u003ch2 style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:36px;margin:0\">Notre travail\u003c/h2>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n      \u003csc-for list=\"{{ galleryIds }}\" as=\"gid\" hint-placeholder-count=\"6\">\n        \u003cdiv style=\"aspect-ratio:1;border-radius:4px;overflow:hidden;border:1px solid rgba(201,151,74,0.18)\">\n          \u003cimage-slot id=\"{{ gid }}\" shape=\"rect\" placeholder=\"Photo\" style=\"width:100%;height:100%\">\u003c/image-slot>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- AVIS -->\n  \u003csection id=\"avis\" style=\"padding:80px 64px;max-width:1200px;margin:0 auto\" data-screen-label=\"avis\">\n    \u003cdiv style=\"text-align:center;margin-bottom:56px\">\n      \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:12px\">Témoignages\u003c/div>\n      \u003ch2 style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:36px;margin:0\">Avis clients\u003c/h2>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n      \u003csc-for list=\"{{ reviewSlots }}\" as=\"r\" hint-placeholder-count=\"3\">\n        \u003cdiv style=\"background:#1c1712;border:1px solid rgba(201,151,74,0.18);border-radius:4px;padding:28px 24px\">\n          \u003cdiv style=\"color:{{ accent }};font-size:16px;letter-spacing:2px;margin-bottom:14px\">★★★★★\u003c/div>\n          \u003cdiv style=\"font-size:14px;line-height:1.6;color:rgba(243,234,217,0.6);font-style:italic\">« Ajoutez ici l'avis d'un client »\u003c/div>\n          \u003cdiv style=\"font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(243,234,217,0.4);margin-top:16px\">Nom du client\u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- RESERVATION -->\n  \u003csection id=\"reservation\" style=\"padding:80px 64px;background:#1c1712;border-top:1px solid rgba(201,151,74,0.2);border-bottom:1px solid rgba(201,151,74,0.2)\" data-screen-label=\"reservation\">\n    \u003cdiv style=\"max-width:640px;margin:0 auto;width:100%\">\n      \u003cdiv style=\"text-align:center;margin-bottom:44px\">\n        \u003cdiv style=\"font-family:'Oswald',sans-serif;color:{{ accent }};letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:12px\">Réservation en ligne\u003c/div>\n        \u003ch2 class=\"booking-title\" style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:36px;margin:0 0 12px\">Prendre rendez-vous\u003c/h2>\n        \u003cdiv style=\"font-size:14px;color:rgba(243,234,217,0.6)\">{{ hoursDisplay }}\u003c/div>\n      \u003c/div>\n\n      \u003csc-if value=\"{{ isFormStep }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:18px;width:100%\">\n          \u003cdiv class=\"booking-form-row\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            \u003cinput class=\"booking-field\" placeholder=\"Nom complet\" value=\"{{ customerName }}\" sc-camel-on-change=\"{{ onNameChange }}\" autocomplete=\"name\" style=\"background:#15120f;border:1px solid rgba(201,151,74,0.3);border-radius:2px;padding:14px 16px;color:#f3ead9;font-size:14px\">\n            \u003cinput class=\"booking-field\" placeholder=\"Téléphone\" value=\"{{ customerPhone }}\" sc-camel-on-change=\"{{ onPhoneChange }}\" autocomplete=\"tel\" inputmode=\"tel\" style=\"background:#15120f;border:1px solid rgba(201,151,74,0.3);border-radius:2px;padding:14px 16px;color:#f3ead9;font-size:14px\">\n          \u003c/div>\n\n          \u003cdiv class=\"booking-form-row\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            \u003csc-raw-select class=\"booking-field\" value=\"{{ selectedService }}\" sc-camel-on-change=\"{{ onServiceChange }}\" style=\"background:#15120f;border:1px solid rgba(201,151,74,0.3);border-radius:2px;padding:14px 16px;color:#f3ead9;font-size:14px\">\n              \u003coption value=\"\">Choisir un service\u003c/option>\n              \u003csc-for list=\"{{ services }}\" as=\"svc\" hint-placeholder-count=\"6\">\n                \u003coption value=\"{{ svc }}\">{{ svc }}\u003c/option>\n              \u003c/sc-for>\n            \u003c/sc-raw-select>\n            \u003csc-raw-select class=\"booking-field\" value=\"{{ selectedBarber }}\" sc-camel-on-change=\"{{ onBarberChange }}\" style=\"background:#15120f;border:1px solid rgba(201,151,74,0.3);border-radius:2px;padding:14px 16px;color:#f3ead9;font-size:14px\">\n              \u003coption value=\"\">Choisir un coiffeur\u003c/option>\n              \u003csc-for list=\"{{ team }}\" as=\"member\" hint-placeholder-count=\"4\">\n                \u003coption value=\"{{ member.name }}\">{{ member.name }}\u003c/option>\n              \u003c/sc-for>\n            \u003c/sc-raw-select>\n          \u003c/div>\n\n          \u003cinput class=\"booking-field\" type=\"date\" value=\"{{ selectedDate }}\" min=\"{{ minDate }}\" sc-camel-on-change=\"{{ onDateChange }}\" style=\"background:#15120f;border:1px solid rgba(201,151,74,0.3);border-radius:2px;padding:14px 16px;color:#f3ead9;font-size:14px;color-scheme:dark;width:100%\">\n\n          \u003csc-if value=\"{{ isClosedDay }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cdiv style=\"color:{{ accent }};font-size:13px;padding:8px 0;line-height:1.5\">Fermé ce jour-là. Merci de choisir une autre date.\u003c/div>\n          \u003c/sc-if>\n\n          \u003csc-if value=\"{{ showSlots }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cdiv style=\"width:100%;min-width:0\">\n              \u003cdiv style=\"font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(243,234,217,0.5);margin-bottom:10px\">Créneaux disponibles\u003c/div>\n              \u003csc-if value=\"{{ slotsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n                \u003cdiv style=\"color:rgba(243,234,217,0.7);font-size:14px;padding:8px 0\">Chargement...\u003c/div>\n              \u003c/sc-if>\n              \u003csc-if value=\"{{ hasSlotsError }}\" hint-placeholder-val=\"{{ false }}\">\n                \u003cdiv style=\"color:#e57373;font-size:13px;padding:8px 0;line-height:1.5;overflow-wrap:anywhere\">{{ slotsError }}\u003c/div>\n              \u003c/sc-if>\n              \u003csc-if value=\"{{ slotsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                \u003cdiv style=\"color:rgba(243,234,217,0.7);font-size:14px;padding:8px 0;line-height:1.5\">Aucun créneau disponible pour cette date.\u003c/div>\n              \u003c/sc-if>\n              \u003csc-if value=\"{{ showSlotButtons }}\" hint-placeholder-val=\"{{ false }}\">\n                \u003cdiv class=\"slots-grid\">\n                  \u003csc-for list=\"{{ timeSlots }}\" as=\"slot\" hint-placeholder-count=\"8\">\n                    \u003cbutton sc-camel-on-click=\"{{ slot.onSelect }}\" disabled=\"{{ slot.taken }}\" style=\"{{ slot.style }}\">{{ slot.label }}\u003c/button>\n                  \u003c/sc-for>\n                \u003c/div>\n              \u003c/sc-if>\n            \u003c/div>\n          \u003c/sc-if>\n\n          \u003csc-if value=\"{{ hasBookingError }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cdiv style=\"color:#e57373;font-size:13px;padding:4px 0 8px;line-height:1.5;overflow-wrap:anywhere\">{{ bookingError }}\u003c/div>\n          \u003c/sc-if>\n\n          \u003cbutton class=\"booking-confirm-btn\" sc-camel-on-click=\"{{ onConfirm }}\" disabled=\"{{ confirmDisabled }}\" style=\"{{ confirmButtonStyle }}\">{{ confirmButtonLabel }}\u003c/button>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{ isConfirmedStep }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003cdiv style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;animation:fadeUp 0.4s ease;width:100%\">\n          \u003cdiv style=\"width:64px;height:64px;border-radius:50%;border:2px solid {{ accent }};display:flex;align-items:center;justify-content:center;color:{{ accent }};font-size:28px\">✓\u003c/div>\n          \u003ch3 class=\"booking-title\" style=\"font-family:'Playfair Display',serif;font-weight:900;font-size:26px;margin:0;padding:0 8px\">Votre créneau est confirmé.\u003c/h3>\n          \u003cdiv style=\"color:rgba(243,234,217,0.75);font-size:15px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere;max-width:100%\">\n            {{ confirmationText }}\n          \u003c/div>\n          \u003cdiv class=\"booking-confirm-actions\" style=\"display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;justify-content:center;width:100%\">\n            \u003ca href=\"{{ calendarUrl }}\" target=\"_blank\" style=\"font-family:'Oswald',sans-serif;background:{{ accent }};color:#15120f;padding:14px 26px;border-radius:2px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:13px\">Ajouter à Google Calendar\u003c/a>\n            \u003cbutton sc-camel-on-click=\"{{ onReset }}\" style=\"font-family:'Oswald',sans-serif;background:transparent;border:1px solid rgba(243,234,217,0.3);color:#f3ead9;padding:14px 26px;border-radius:2px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:13px;cursor:pointer\">Nouvelle réservation\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- FOOTER -->\n  \u003cfooter class=\"site-footer\" style=\"padding:48px 64px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;color:rgba(243,234,217,0.5);font-size:13px\">\n    \u003cdiv style=\"font-family:'Playfair Display',serif;font-weight:700;color:#f3ead9;font-size:16px\">Riders Barber Shop\u003c/div>\n    \u003cdiv>{{ hoursDisplay }}\u003c/div>\n    \u003ca href=\"https://www.google.com/maps/@33.5322184,-7.6479047,20z\" target=\"_blank\" style=\"color:{{ accent }}\">Voir sur Google Maps\u003c/a>\n  \u003c/footer>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{},&quot;accentGold&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c9974a&quot;,&quot;options&quot;:[&quot;#c9974a&quot;,&quot;#b8863d&quot;,&quot;#d4a85a&quot;,&quot;#a67c3d&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Apparence&quot;},&quot;openHour&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9,&quot;min&quot;:6,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Horaires&quot;,&quot;unit&quot;:&quot;h&quot;},&quot;closeHour&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:19,&quot;min&quot;:14,&quot;max&quot;:23,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Horaires&quot;,&quot;unit&quot;:&quot;h&quot;},&quot;closedSunday&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Horaires&quot;},&quot;slotInterval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:45,&quot;min&quot;:15,&quot;max&quot;:60,&quot;step&quot;:15,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Horaires&quot;,&quot;unit&quot;:&quot;min&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    step: 'form',\n    customerName: '',\n    customerPhone: '',\n    selectedService: '',\n    selectedBarber: '',\n    selectedDate: '',\n    selectedTime: '',\n    confirmed: null,\n    availableSlots: [],\n    slotsLoading: false,\n    slotsError: null,\n    slotsEmpty: false,\n    bookingInFlight: false,\n    bookingError: null,\n    noticeVisible: false,\n    noticeType: 'info',\n    noticeBody: '',\n  };\n\n  apiBaseUrl = 'http://localhost:3001';\n\n  services = ['Coupe', 'Barbe', 'Shampooing', 'Lissage protéine', 'Lissage shampooing', 'Soin du visage'];\n  team = [\n    { name: 'Coiffeur 1', role: 'Barbier senior' },\n    { name: 'Coiffeur 2', role: 'Barbier' },\n    { name: 'Coiffeur 3', role: 'Barbier' },\n    { name: 'Coiffeur 4', role: 'Coiffeur styliste' },\n  ];\n\n  isSunday(dateStr) {\n    if (!dateStr) return false;\n    const d = new Date(dateStr + 'T00:00:00');\n    return d.getDay() === 0;\n  }\n\n  toBarberSlug(barberName) {\n    return String(barberName || '')\n      .trim()\n      .toLowerCase()\n      .replace(/\\s+/g, '-')\n      .replace(/[^a-z0-9-]/g, '');\n  }\n\n  toServiceSlug(serviceName) {\n    return String(serviceName || '')\n      .trim()\n      .toLowerCase()\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .replace(/\\s+/g, '-')\n      .replace(/[^a-z0-9-]/g, '');\n  }\n\n  formatSlotLabel(hhmm) {\n    return String(hhmm).replace(':', 'h');\n  }\n\n  /**\n   * Charge les créneaux réels depuis GET /api/availability.\n   * Réutilisable après réservation ou après un 409 slot_unavailable.\n   */\n  loadAvailability = async (overrides = {}) => {\n    const selectedDate = overrides.selectedDate ?? this.state.selectedDate;\n    const selectedBarber = overrides.selectedBarber ?? this.state.selectedBarber;\n    const selectedService = overrides.selectedService ?? this.state.selectedService;\n    const closedSunday = this.props.closedSunday ?? true;\n\n    if (!selectedDate || !selectedBarber || !selectedService) {\n      this.setState({\n        availableSlots: [],\n        slotsLoading: false,\n        slotsError: null,\n        slotsEmpty: false,\n      });\n      return;\n    }\n\n    if (closedSunday && this.isSunday(selectedDate)) {\n      this.setState({\n        availableSlots: [],\n        slotsLoading: false,\n        slotsError: null,\n        slotsEmpty: false,\n      });\n      return;\n    }\n\n    const requestId = (this._availabilityRequestId = (this._availabilityRequestId || 0) + 1);\n    this.setState({\n      slotsLoading: true,\n      slotsError: null,\n      slotsEmpty: false,\n      availableSlots: [],\n      selectedTime: '',\n    });\n\n    try {\n      const params = new URLSearchParams({\n        date: selectedDate,\n        barber: this.toBarberSlug(selectedBarber),\n        service: this.toServiceSlug(selectedService),\n      });\n      const res = await fetch(`${this.apiBaseUrl}/api/availability?${params.toString()}`);\n      let data = null;\n      try {\n        data = await res.json();\n      } catch (_) {\n        data = null;\n      }\n\n      if (requestId !== this._availabilityRequestId) return;\n\n      if (!res.ok) {\n        const msg =\n          (data && (data.error || data.message)) ||\n          `Impossible de charger les créneaux (erreur ${res.status}).`;\n        this.setState({\n          slotsLoading: false,\n          availableSlots: [],\n          slotsError: msg,\n          slotsEmpty: false,\n        });\n        return;\n      }\n\n      if (!Array.isArray(data)) {\n        this.setState({\n          slotsLoading: false,\n          availableSlots: [],\n          slotsError: 'Réponse invalide du serveur.',\n          slotsEmpty: false,\n        });\n        return;\n      }\n\n      const availableSlots = data.map((t) => this.formatSlotLabel(t));\n      this.setState({\n        slotsLoading: false,\n        availableSlots,\n        slotsError: null,\n        slotsEmpty: availableSlots.length === 0,\n      });\n    } catch (_) {\n      if (requestId !== this._availabilityRequestId) return;\n      this.setState({\n        slotsLoading: false,\n        availableSlots: [],\n        slotsError: 'Impossible de contacter le serveur. Vérifiez que le backend tourne sur le port 3001.',\n        slotsEmpty: false,\n      });\n    }\n  };\n\n  onNameChange = (e) => this.setState({ customerName: e.target.value });\n  onPhoneChange = (e) => this.setState({ customerPhone: e.target.value });\n  onServiceChange = (e) => {\n    const selectedService = e.target.value;\n    this.setState({ selectedService, selectedTime: '', bookingError: null });\n    this.loadAvailability({ selectedService });\n  };\n  onBarberChange = (e) => {\n    const selectedBarber = e.target.value;\n    this.setState({ selectedBarber, selectedTime: '', bookingError: null });\n    this.loadAvailability({ selectedBarber });\n  };\n  onDateChange = (e) => {\n    const selectedDate = e.target.value;\n    this.setState({ selectedDate, selectedTime: '', bookingError: null });\n    this.loadAvailability({ selectedDate });\n  };\n  selectTime = (label) => this.setState({ selectedTime: label, bookingError: null });\n\n  formatTimeForApi(label) {\n    return String(label || '').replace('h', ':');\n  }\n\n  showNotice(body, { type = 'info', durationMs = 10000 } = {}) {\n    if (this._noticeTimer) {\n      clearTimeout(this._noticeTimer);\n      this._noticeTimer = null;\n    }\n    this.setState({\n      noticeVisible: true,\n      noticeType: type,\n      noticeBody: body,\n    });\n    this._noticeTimer = setTimeout(() => {\n      this.setState({ noticeVisible: false });\n      this._noticeTimer = null;\n    }, durationMs);\n  }\n\n  buildSuccessNotice({ selectedBarber, selectedDate, selectedTime, selectedService }) {\n    return [\n      'Votre créneau est confirmé.',\n      selectedBarber,\n      this.formatDateFr(selectedDate),\n      selectedTime,\n      selectedService,\n    ].join('\\n');\n  }\n\n  onConfirm = async () => {\n    const {\n      customerName,\n      customerPhone,\n      selectedService,\n      selectedBarber,\n      selectedDate,\n      selectedTime,\n      bookingInFlight,\n    } = this.state;\n\n    if (bookingInFlight) return;\n    if (!customerName || !customerPhone || !selectedService || !selectedBarber || !selectedDate || !selectedTime) return;\n\n    this.setState({ bookingInFlight: true, bookingError: null });\n\n    const payload = {\n      date: selectedDate,\n      time: this.formatTimeForApi(selectedTime),\n      barber: this.toBarberSlug(selectedBarber),\n      service: this.toServiceSlug(selectedService),\n      customerName: customerName.trim(),\n      customerPhone: customerPhone.trim(),\n    };\n\n    try {\n      const res = await fetch(`${this.apiBaseUrl}/api/book`, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(payload),\n      });\n\n      let data = null;\n      try {\n        data = await res.json();\n      } catch (_) {\n        data = null;\n      }\n\n      if (res.status === 201 && data && data.ok) {\n        const successNotice = this.buildSuccessNotice({\n          selectedBarber,\n          selectedDate,\n          selectedTime,\n          selectedService,\n        });\n        this.setState({\n          bookingInFlight: false,\n          bookingError: null,\n          step: 'confirmed',\n          confirmed: {\n            customerName,\n            customerPhone,\n            selectedService,\n            selectedBarber,\n            selectedDate,\n            selectedTime,\n            bookingId: data.bookingId,\n            googleEventId: data.googleEventId,\n          },\n        });\n        this.showNotice(successNotice, { type: 'success', durationMs: 12000 });\n        await this.loadAvailability();\n        return;\n      }\n\n      if (res.status === 409 && data && data.error === 'slot_unavailable') {\n        const msg = \"Ce créneau vient d’être réservé. Merci d’en choisir un autre.\";\n        this.setState({\n          bookingInFlight: false,\n          selectedTime: '',\n          bookingError: msg,\n        });\n        this.showNotice(msg, { type: 'warn', durationMs: 10000 });\n        await this.loadAvailability();\n        return;\n      }\n\n      if (res.status === 400) {\n        const msg =\n          (data && (data.error || data.message)) ||\n          'Les informations saisies sont invalides. Merci de vérifier le formulaire.';\n        this.setState({ bookingInFlight: false, bookingError: msg });\n        this.showNotice(msg, { type: 'error', durationMs: 10000 });\n        return;\n      }\n\n      const msg = 'Une erreur est survenue. Veuillez réessayer.';\n      this.setState({ bookingInFlight: false, bookingError: msg });\n      this.showNotice(msg, { type: 'error', durationMs: 10000 });\n    } catch (_) {\n      const msg = 'Une erreur est survenue. Veuillez réessayer.';\n      this.setState({\n        bookingInFlight: false,\n        bookingError: msg,\n      });\n      this.showNotice(msg, { type: 'error', durationMs: 10000 });\n    }\n  };\n\n  onReset = () => {\n    if (this._noticeTimer) {\n      clearTimeout(this._noticeTimer);\n      this._noticeTimer = null;\n    }\n    this.setState({\n      step: 'form',\n      customerName: '',\n      customerPhone: '',\n      selectedService: '',\n      selectedBarber: '',\n      selectedDate: '',\n      selectedTime: '',\n      confirmed: null,\n      availableSlots: [],\n      slotsLoading: false,\n      slotsError: null,\n      slotsEmpty: false,\n      bookingInFlight: false,\n      bookingError: null,\n      noticeVisible: false,\n      noticeType: 'info',\n      noticeBody: '',\n    });\n  };\n\n  formatDateFr(dateStr) {\n    const d = new Date(dateStr + 'T00:00:00');\n    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });\n  }\n\n  buildCalendarUrl(c) {\n    const [hh, mm] = c.selectedTime.replace('h', ':').split(':');\n    const interval = this.props.slotInterval ?? 45;\n    const start = new Date(c.selectedDate + 'T00:00:00');\n    start.setHours(parseInt(hh, 10), parseInt(mm, 10), 0, 0);\n    const end = new Date(start.getTime() + interval * 60000);\n    const fmt = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';\n    const params = new URLSearchParams({\n      action: 'TEMPLATE',\n      text: `Riders Barber Shop — ${c.selectedService} avec ${c.selectedBarber}`,\n      dates: `${fmt(start)}/${fmt(end)}`,\n      details: `Rendez-vous pour ${c.customerName} (${c.customerPhone}) — ${c.selectedService} avec ${c.selectedBarber}`,\n      location: 'Riders Barber Shop',\n    });\n    return `https://calendar.google.com/calendar/render?${params.toString()}`;\n  }\n\n  renderVals() {\n    const accent = this.props.accentGold ?? '#c9974a';\n    const openHour = this.props.openHour ?? 9;\n    const closeHour = this.props.closeHour ?? 19;\n    const closedSunday = this.props.closedSunday ?? true;\n    const {\n      step, customerName, customerPhone, selectedService, selectedBarber, selectedDate, selectedTime, confirmed,\n      availableSlots, slotsLoading, slotsError, slotsEmpty, bookingInFlight, bookingError,\n      noticeVisible, noticeType, noticeBody,\n    } = this.state;\n\n    const isClosedDay = closedSunday && this.isSunday(selectedDate);\n    const showSlots = !!(selectedDate && selectedBarber && selectedService && !isClosedDay);\n    const hasSlotsError = !!slotsError;\n    const showSlotButtons = showSlots && !slotsLoading && !hasSlotsError && !slotsEmpty && availableSlots.length > 0;\n\n    const timeSlots = availableSlots.map((label) => {\n      const active = selectedTime === label;\n      return {\n        label,\n        taken: false,\n        onSelect: () => this.selectTime(label),\n        style: `font-family:'Oswald',sans-serif;font-size:13px;padding:12px 8px;border-radius:2px;cursor:pointer;border:1px solid ${active ? accent : 'rgba(201,151,74,0.3)'};background:${active ? accent : 'transparent'};color:${active ? '#15120f' : '#f3ead9'};text-decoration:none;min-height:44px;width:100%;min-width:0`,\n      };\n    });\n\n    const canConfirm = !!(customerName && customerPhone && selectedService && selectedBarber && selectedDate && selectedTime && !isClosedDay);\n    const confirmEnabled = canConfirm && !bookingInFlight;\n    const confirmationText = confirmed\n      ? [confirmed.selectedBarber, this.formatDateFr(confirmed.selectedDate), confirmed.selectedTime, confirmed.selectedService].join('\\n')\n      : '';\n\n    const hoursDisplay = `${closedSunday ? 'Lun–Sam' : 'Tous les jours'} · ${openHour}h–${closeHour}h`;\n\n    const noticeStyles =\n      noticeType === 'success'\n        ? { bg: '#1f2a1a', border: accent, fg: '#f3ead9' }\n        : noticeType === 'warn'\n          ? { bg: '#2a2314', border: accent, fg: '#f3ead9' }\n          : { bg: '#2a1215', border: '#e57373', fg: '#ffcdd2' };\n\n    return {\n      accent,\n      services: this.services,\n      team: this.team,\n      galleryIds: ['gal-1', 'gal-2', 'gal-3', 'gal-4', 'gal-5', 'gal-6'],\n      reviewSlots: [0, 1, 2],\n      isFormStep: step === 'form',\n      isConfirmedStep: step === 'confirmed',\n      customerName, customerPhone, selectedService, selectedBarber, selectedDate,\n      onNameChange: this.onNameChange, onPhoneChange: this.onPhoneChange,\n      onServiceChange: this.onServiceChange, onBarberChange: this.onBarberChange, onDateChange: this.onDateChange,\n      minDate: new Date().toISOString().split('T')[0],\n      isClosedDay,\n      showSlots,\n      slotsLoading,\n      hasSlotsError,\n      slotsError: slotsError || '',\n      slotsEmpty: showSlots && slotsEmpty && !slotsLoading && !hasSlotsError,\n      showSlotButtons,\n      timeSlots,\n      canConfirm,\n      confirmDisabled: !confirmEnabled,\n      confirmButtonLabel: bookingInFlight ? 'Réservation...' : 'Confirmer le rendez-vous',\n      hasBookingError: !!bookingError,\n      bookingError: bookingError || '',\n      onConfirm: this.onConfirm,\n      confirmButtonStyle: `font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.5px;text-transform:uppercase;padding:16px;border-radius:2px;border:none;font-weight:600;cursor:${confirmEnabled ? 'pointer' : 'not-allowed'};background:${confirmEnabled ? accent : 'rgba(201,151,74,0.2)'};color:${confirmEnabled ? '#15120f' : 'rgba(243,234,217,0.4)'};width:100%;min-height:48px`,\n      confirmationText,\n      calendarUrl: confirmed ? this.buildCalendarUrl(confirmed) : '#',\n      onReset: this.onReset,\n      hoursDisplay,\n      showNotice: !!noticeVisible,\n      noticeBody: noticeBody || '',\n      noticeBg: noticeStyles.bg,\n      noticeBorder: noticeStyles.border,\n      noticeFg: noticeStyles.fg,\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>
